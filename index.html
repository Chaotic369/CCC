<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>24x60 Edge-to-Edge Grid</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000000;
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* Left section strictly 75%, completely flush */
        .left-panel {
            width: 75%;
            height: 100%;
            /* Padding removed for edge-to-edge fit */
        }

        /* Right section 25% */
                .right-panel {
                    width: 25%;
                    height: 100%;
                    display: flex;
                    justify-content: center;
                    padding-top: 20px;
                    box-sizing: border-box;
                }

                #toggle-btn {
                    background-color: transparent;
                    color: grey;
                    border: 1px solid grey;
                    padding: 10px 20px;
                    cursor: pointer;
                    font-size: 14px;
                    height: fit-content;
                    font-family: sans-serif;
                }
        
                #toggle-btn:hover {
                    background-color: grey;
                    color: black;
                }

                /* Grid fills the left panel entirely */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(24, 1fr);
            grid-template-rows: repeat(60, 1fr);
            width: 100%;
            height: 100%;
            /* Gap removed to keep edges completely tight */
        }

        /* Grid cells compress/stretch into rectangles automatically */
                .grid-cell {
                    box-sizing: border-box;
                    border: 1px solid grey;
                    background-color: #000000;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    color: grey;
                    font-size: min(1vw, 1.2vh); /* dynamically fits */
                    overflow: hidden;
                    user-select: none;
                }

                .grid-cell:hover {
                    background-color: #ffffff;
                    color: #000000;
                    transition: all 0.1s;
                }

                @keyframes flashAnim {
                    0% { background-color: #ffffff; color: #000000; }
                    100% { background-color: #000000; color: grey; }
                }

                .flash {
                    animation: flashAnim 0.5s ease-out;
                }

                /* 300 boxes grid: 15 cols x 20 rows = 300 */
                .grid-container.grid-300 {
                    grid-template-columns: repeat(15, 1fr);
                    grid-template-rows: repeat(20, 1fr);
                }
            </style>
</head>
<body>

    <div class="left-panel">
        <div class="grid-container" id="matrix-grid"></div>
    </div>

    <div class="right-panel"></div>

    <script>
            const gridContainer = document.getElementById('matrix-grid');
            const totalCells = 24 * 60; 

            function renderGrid(count, isSubGrid) {
                gridContainer.innerHTML = '';
            
                if (isSubGrid) {
                    gridContainer.classList.add('grid-300');
                } else {
                    gridContainer.classList.remove('grid-300');
                }
            
                const fragment = document.createDocumentFragment();
                for (let i = 0; i < count; i++) {
                    const cell = document.createElement('div');
                    cell.className = 'grid-cell';
                    fragment.appendChild(cell);
                }
            
                gridContainer.appendChild(fragment);
            }

            gridContainer.addEventListener('click', function(e) {
                if (e.target.classList.contains('grid-cell') && !gridContainer.classList.contains('grid-300')) {
                    renderGrid(300, true);
                }
            });

            renderGrid(totalCells, false);
        </script>

</body>
</html>
