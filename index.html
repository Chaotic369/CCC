<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>24x60 Edge-to-Edge Grid</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000000;
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* Left section strictly 75%, completely flush */
                .left-panel {
                    width: 75%;
                    height: 100%;
                    position: relative; /* Added for the flash text overlay */
                }

                /* The new text flash overlay */
                #flash-text {
                    position: absolute;
                    top: 50%;
                    left: 50%;
                    transform: translate(-50%, -50%);
                    color: white;
                    font-family: sans-serif;
                    font-size: 8vw;
                    font-weight: bold;
                    pointer-events: none; /* So it doesn't block your clicks */
                    opacity: 0;
                    text-shadow: 0 0 20px rgba(255,255,255,0.5);
                    z-index: 10;
                }

                @keyframes flashTextAnim {
                    0% { opacity: 1; transform: translate(-50%, -50%) scale(0.8); }
                    20% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
                    100% { opacity: 0; transform: translate(-50%, -50%) scale(1.5); }
                }

                /* Right section 25% */
                .right-panel {
                    width: 25%;
                    height: 100%;
                    display: flex;
                    justify-content: center;
                    padding-top: 20px;
                    box-sizing: border-box;
                }

                #toggle-btn {
                    background-color: transparent;
                    color: grey;
                    border: 1px solid grey;
                    padding: 10px 20px;
                    cursor: pointer;
                    font-size: 14px;
                    height: fit-content;
                    font-family: sans-serif;
                }
        
                #toggle-btn:hover {
                    background-color: grey;
                    color: black;
                }

                /* Grid fills the left panel entirely */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(24, 1fr);
            grid-template-rows: repeat(60, 1fr);
            width: 100%;
            height: 100%;
            /* Gap removed to keep edges completely tight */
        }

        /* Grid cells compress/stretch into rectangles automatically */
                .grid-cell {
                    box-sizing: border-box;
                    border: 1px solid grey;
                    background-color: #000000;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    color: grey;
                    font-size: min(1vw, 1.2vh); /* dynamically fits */
                    overflow: hidden;
                    user-select: none;
                }

                .grid-cell:hover {
                            background-color: #ffffff;
                            color: #000000;
                            transition: all 0.1s;
                        }

                        /* 300 boxes grid: 15 cols x 20 rows = 300 */
                                        .grid-container.grid-300 {
                                                            grid-template-columns: repeat(15, 1fr);
                                                            grid-template-rows: repeat(20, 1fr);
                                                            grid-auto-flow: column; /* Restored to fill vertically (top-to-bottom first) */
                                                        }
                                                    </style>
</head>
<body>

    <div class="left-panel">
            <div id="flash-text"></div>
            <div class="grid-container" id="matrix-grid"></div>
        </div>

    <div class="right-panel">
            <button id="toggle-btn">Toggle Grid</button>
        </div>

    <script>
                const gridContainer = document.getElementById('matrix-grid');
                const toggleBtn = document.getElementById('toggle-btn');
                const flashTextEl = document.getElementById('flash-text');
                const totalCells = 24 * 60; 
                let isCurrentGrid300 = false;
                let activeMainBox = 1;
                let simInterval = null;

                function renderGrid(count, isSubGrid) {
                    if (simInterval) clearInterval(simInterval);
                    isCurrentGrid300 = isSubGrid;
                    gridContainer.innerHTML = '';
            
                    if (isSubGrid) {
                        gridContainer.classList.add('grid-300');
                    } else {
                        gridContainer.classList.remove('grid-300');
                    }
            
                    const fragment = document.createDocumentFragment();
                    for (let i = 0; i < count; i++) {
                        const cell = document.createElement('div');
                        cell.className = 'grid-cell'; 
                        if (!isSubGrid) {
                            cell.textContent = i + 1; 
                            // Remember the box number so clicking it opens its specific grid
                            cell.dataset.boxNum = i + 1;
                        } else {
                            // Keep cells blank initially for the simulation
                            cell.textContent = ''; 
                        }
                        fragment.appendChild(cell);
                    }
            
                    gridContainer.appendChild(fragment);

                    // Handle the Flash Text Overlay
                    if (isSubGrid) {
                        flashTextEl.textContent = 'BOX ' + activeMainBox;
                        toggleBtn.textContent = 'Next Box Grid';
                        startSimulation();
                    } else {
                        flashTextEl.textContent = 'MAIN GRID';
                        toggleBtn.textContent = 'Open Box Grid';
                    }
            
                    flashTextEl.style.animation = 'none';
                    void flashTextEl.offsetWidth; // Trigger reflow to restart animation
                    flashTextEl.style.animation = 'flashTextAnim 1s ease-out forwards';
                }

                function startSimulation() {
                                let currentTick = 0;
                                const cells = gridContainer.querySelectorAll('.grid-cell');
                
                                // Track the color and streak independently for each of the 20 rows
                                const rowStates = Array.from({ length: 20 }, () => ({ color: null, streak: 0 }));
                
                                simInterval = setInterval(() => {
                                    if (currentTick >= 300) {
                                        clearInterval(simInterval);
                                        return;
                                    }
                    
                                    // Random tick: green (up) or red (down)
                                    const isGreen = Math.random() > 0.5;
                                    const tickColor = isGreen ? '#00ff00' : '#ff0000';
                    
                                    // Calculate which row this tick falls into (0 to 19)
                                    const row = currentTick % 20;
                    
                                    // Check the streak horizontally (compare with the last state of this specific row)
                                    if (rowStates[row].color === tickColor) {
                                        rowStates[row].streak++;
                                    } else {
                                        rowStates[row].streak = 1;
                                        rowStates[row].color = tickColor;
                                    }
                    
                                    const cell = cells[currentTick];
                                    cell.textContent = 'x' + rowStates[row].streak;
                                    cell.style.color = tickColor;
                                    cell.style.fontWeight = 'bold';
                    
                                    currentTick++;
                                }, 1000); // 1 tick per second
                            }

            gridContainer.addEventListener('click', function(e) {
                if (e.target.classList.contains('grid-cell')) {
                    if (!isCurrentGrid300) {
                        // Clicked a main grid box -> go to its 300 grid
                        activeMainBox = parseInt(e.target.dataset.boxNum);
                        renderGrid(300, true);
                    } else {
                        // Clicked inside a 300 grid -> go back to main grid
                        renderGrid(totalCells, false);
                    }
                }
            });

            toggleBtn.addEventListener('click', function() {
                if (isCurrentGrid300) {
                    // If already in a sub-grid, cycle to the next box's grid
                    activeMainBox++;
                    if (activeMainBox > totalCells) activeMainBox = 1;
                    renderGrid(300, true);
                } else {
                    // Open the grid for whatever box was active last (default 1)
                    renderGrid(300, true);
                }
            });

            renderGrid(totalCells, false);
        </script>

</body>
</html>
