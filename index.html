<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>24x60 Grid Layout</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000432;
            height: 100vh;
            display: flex; /* Splits the screen into left and right sections */
            overflow: hidden;
        }

        /* Left section taking up exactly 75% of the viewport */
        .left-panel {
            width: 75%;
            height: 100%;
            padding: 10px;
            box-sizing: border-box;
        }

        /* Right section taking the remaining 25% and staying completely empty */
        .right-panel {
            width: 25%;
            height: 100%;
        }

        /* The 24x60 grid container */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(24, 1fr);
            grid-template-rows: repeat(60, 1fr);
            width: 100%;
            height: 100%;
            gap: 1px; /* Spacing between cells */
        }

        /* Individual grid cells */
        .grid-cell {
            background-color: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1px;
        }

        .grid-cell:hover {
            background-color: rgba(255, 255, 255, 0.2);
            transition: background-color 0.2s;
        }
    </style>
</head>
<body>

    <div class="left-panel">
        <div class="grid-container" id="matrix-grid">
            <!-- JavaScript will populate the 1440 cells to keep the HTML clean -->
        </div>
    </div>

    <div class="right-panel">
        <!-- Totally empty as requested -->
    </div>

    <script>
        // Generate the 24 columns * 60 rows = 1440 cells
        const gridContainer = document.getElementById('matrix-grid');
        const totalCells = 24 * 60; 

        // Fragment used for better rendering performance
        const fragment = document.createDocumentFragment();

        for (let i = 0; i < totalCells; i++) {
            const cell = document.createElement('div');
            cell.className = 'grid-cell';
            fragment.appendChild(cell);
        }

        gridContainer.appendChild(fragment);
    </script>

</body>
</html>
