<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>24x60 Edge-to-Edge Grid</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000000;
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* Left section strictly 75%, completely flush */
                        .left-panel {
                            width: 75%;
                            height: 100%;
                            position: relative; /* Added for the flash text overlay */
                            display: flex; /* Flex layout to keep row numbers and grid side-by-side */
                        }

                        #row-numbers {
                                            width: 40px;
                                            height: 100%;
                                            border-left: 3px solid grey; /* Bold separation line */
                                            display: flex;
                                            flex-direction: column;
                                            box-sizing: border-box;
                                            background-color: #000000;
                                            z-index: 5;
                                        }

                        .row-number {
                                            flex: 1;
                                            display: flex;
                                            align-items: center;
                                            justify-content: center;
                                            color: grey;
                                            font-size: min(1vw, 1.2vh);
                                            font-family: sans-serif;
                                            box-sizing: border-box;
                                            border-bottom: 1px solid grey;
                                            border-right: 1px solid grey;
                                            background-color: #000000;
                                        }
                
                                        .row-number:first-child {
                                            border-top: 1px solid grey;
                                        }

                /* The new text flash overlay */
                #flash-text {
                    position: absolute;
                    top: 50%;
                    left: 50%;
                    transform: translate(-50%, -50%);
                    color: white;
                    font-family: sans-serif;
                    font-size: 8vw;
                    font-weight: bold;
                    pointer-events: none; /* So it doesn't block your clicks */
                    opacity: 0;
                    text-shadow: 0 0 20px rgba(255,255,255,0.5);
                    z-index: 10;
                }

                @keyframes flashTextAnim {
                    0% { opacity: 1; transform: translate(-50%, -50%) scale(0.8); }
                    20% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
                    100% { opacity: 0; transform: translate(-50%, -50%) scale(1.5); }
                }

                /* Right section 25% */
                                                .right-panel {
                                                    width: 25%;
                                                    height: 100%;
                                                    display: flex;
                                                    flex-direction: column;
                                                    box-sizing: border-box;
                                                    font-family: sans-serif;
                                                    background-color: #000000;
                                                    border-left: 2px solid #333;
                                                }

                                                .dash-header {
                                                    text-align: center;
                                                    color: #ffd700;
                                                    font-size: 20px;
                                                    font-weight: bold;
                                                    padding: 15px 0 10px 0;
                                                    border-bottom: 1px solid #333;
                                                    letter-spacing: 2px;
                                                }

                                                .control-bar {
                                                    padding: 10px;
                                                    border-bottom: 1px solid #333;
                                                    display: flex;
                                                    flex-direction: column;
                                                    gap: 10px;
                                                }

                                                .control-row {
                                                    display: flex;
                                                    justify-content: space-between;
                                                    align-items: center;
                                                    gap: 5px;
                                                }

                                                .ctrl-btn {
                                                    background: transparent;
                                                    border: 1px solid grey;
                                                    color: grey;
                                                    padding: 4px 8px;
                                                    font-size: 11px;
                                                    cursor: pointer;
                                                    flex: 1;
                                                    text-align: center;
                                                    transition: all 0.2s;
                                                }

                                                .ctrl-btn.active {
                                                    background: grey;
                                                    color: black;
                                                    font-weight: bold;
                                                }

                                                .sens-slider {
                                                    width: 50%;
                                                    accent-color: #ffd700;
                                                    cursor: pointer;
                                                }

                                                .signal-tables {
                                                    flex: 1;
                                                    overflow-y: auto;
                                                    padding: 15px 10px;
                                                    display: flex;
                                                    flex-direction: column;
                                                    gap: 20px;
                                                }

                                                .table-title {
                                                    font-size: 14px;
                                                    font-weight: bold;
                                                    margin-bottom: 5px;
                                                    text-align: center;
                                                    letter-spacing: 1px;
                                                }

                                                .pink-text { color: #ff00ff; }
                                                .cyan-text { color: #00ffff; }

                                                .sig-table {
                                                    display: grid;
                                                    grid-template-columns: 1fr 1fr 1.2fr 1fr 1fr;
                                                    gap: 1px;
                                                    background-color: #333;
                                                    border: 1px solid #333;
                                                }

                                                .sig-table > div {
                                                    background-color: #000;
                                                    padding: 6px 2px;
                                                    text-align: center;
                                                    font-size: 11px;
                                                    color: #ccc;
                                                    display: flex;
                                                    align-items: center;
                                                    justify-content: center;
                                                }

                                                .sig-table .th {
                                                    font-weight: bold;
                                                    background-color: #111;
                                                    color: #fff;
                                                }

                                                .pink-table .highlight { color: #ff00ff; font-weight: bold; }
                                                .cyan-table .highlight { color: #00ffff; font-weight: bold; }

                                                .status-footer {
                                                    border-top: 1px solid #333;
                                                    padding: 10px;
                                                    font-size: 11px;
                                                    color: grey;
                                                    display: flex;
                                                    flex-direction: column;
                                                    gap: 8px;
                                                    background-color: #0a0a0a;
                                                }
                                
                                                .status-footer .time-display {
                                                    text-align: center;
                                                    color: #fff;
                                                    font-family: monospace;
                                                    font-size: 13px;
                                                }

                                                .status-footer .thresholds {
                                                    text-align: center;
                                                    letter-spacing: 1px;
                                                }

                                                .status-badge {
                                                    background-color: #003300;
                                                    color: #00ff00;
                                                    text-align: center;
                                                    padding: 6px;
                                                    border-radius: 3px;
                                                    font-weight: bold;
                                                    letter-spacing: 2px;
                                                    border: 1px solid #00ff00;
                                                }

                /* Grid fills the left panel entirely */
                        .grid-container {
                            display: grid;
                            grid-template-columns: repeat(24, 1fr);
                            grid-template-rows: repeat(60, 1fr);
                            flex: 1; /* Takes the remaining space dynamically next to row-numbers */
                            height: 100%;
                            /* Gap removed to keep edges completely tight */
                        }

        /* Grid cells compress/stretch into rectangles automatically */
                .grid-cell {
                    box-sizing: border-box;
                    border: 1px solid grey;
                    background-color: #000000;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    color: grey;
                    font-size: min(1vw, 1.2vh); /* dynamically fits */
                    overflow: hidden;
                    user-select: none;
                }

                .grid-cell:hover {
                            background-color: #ffffff;
                            color: #000000;
                            transition: all 0.1s;
                        }

                        /* 300 boxes grid: 5 cols x 60 rows = 300 */
                                                                .grid-container.grid-300 {
                                                                                    grid-template-columns: repeat(5, 1fr);
                                                                                    grid-template-rows: repeat(60, 1fr);
                                                                                    grid-auto-flow: column; /* Restored to fill vertically (top-to-bottom first) */
                                                                                }
                                                    </style>
</head>
<body>

    <div class="left-panel">
                <div id="flash-text"></div>
                <div class="grid-container" id="matrix-grid"></div>
                <div id="row-numbers"></div>
            </div>

    <div class="right-panel">
            <div class="dash-header">XAUUSD PRO</div>
        
            <div class="control-bar">
                <div class="control-row">
                    <button class="ctrl-btn">BS %</button>
                    <button class="ctrl-btn active">1s</button>
                    <button class="ctrl-btn">5s</button>
                    <button class="ctrl-btn">1m</button>
                </div>
                <div class="control-row">
                    <!-- Both Reversal and Momentum active by default per requirements -->
                    <button class="ctrl-btn active">REV</button>
                    <button class="ctrl-btn active">MOM</button>
                    <input type="range" min="1" max="100" value="75" class="sens-slider" title="Sensitivity">
                </div>
            </div>

            <div class="signal-tables">
                <div class="table-title pink-text">REVERSAL</div>
                <div class="sig-table pink-table">
                    <div class="th">C/R</div><div class="th">VOL</div><div class="th">STRK</div><div class="th">VARS</div><div class="th">WIN%</div>
                    <!-- Simulated Live Data Rows -->
                    <div class="td">C117</div><div class="td">1.2k</div><div class="td">X4-X5</div><div class="td">N:22</div><div class="td highlight">91%</div>
                    <div class="td">R100</div><div class="td">0.8k</div><div class="td">X3-X4</div><div class="td">N:18</div><div class="td highlight">86%</div>
                </div>

                <div class="table-title cyan-text">MOMENTUM</div>
                <div class="sig-table cyan-table">
                    <div class="th">C/R</div><div class="th">VOL</div><div class="th">STRK</div><div class="th">VARS</div><div class="th">WIN%</div>
                    <!-- Simulated Live Data Rows -->
                    <div class="td">C112</div><div class="td">3.1k</div><div class="td">X6-X7</div><div class="td">N:14</div><div class="td highlight">94%</div>
                    <div class="td">R105</div><div class="td">2.2k</div><div class="td">X5-X6</div><div class="td">N:19</div><div class="td highlight">82%</div>
                </div>
            </div>

            <div class="status-footer">
                <div class="time-display" id="time-display">IST: --:--:-- | NY: --:--:--</div>
                <div class="thresholds">MIN: 61 | MAX: 120</div>
                <div class="status-badge">LIVE 24x7</div>
            </div>
        </div>

    <script>
                    const gridContainer = document.getElementById('matrix-grid');
                                        const rowNumbersEl = document.getElementById('row-numbers');
                                        const flashTextEl = document.getElementById('flash-text');
                                        const totalCells = 24 * 60; 
                                        let isCurrentGrid300 = false;
                                        let activeMainBox = 1;
                                        let simInterval = null;

                                        function renderGrid(count, isSubGrid) {
                                    if (simInterval) {
                                                                            clearInterval(simInterval);
                                                                            simInterval = null;
                                                                        }
                                                                        isCurrentGrid300 = isSubGrid;
                                                                        gridContainer.innerHTML = '';
                                                                        rowNumbersEl.innerHTML = ''; // Clear row numbers
            
                                                                        if (isSubGrid) {
                        gridContainer.classList.add('grid-300');
                    } else {
                        gridContainer.classList.remove('grid-300');
                    }
            
                    const fragment = document.createDocumentFragment();
                    for (let i = 0; i < count; i++) {
                        const cell = document.createElement('div');
                        cell.className = 'grid-cell'; 
                        if (!isSubGrid) {
                            cell.textContent = i + 1; 
                            // Remember the box number so clicking it opens its specific grid
                            cell.dataset.boxNum = i + 1;
                        } else {
                            // Keep cells blank initially for the simulation
                            cell.textContent = ''; 
                        }
                        fragment.appendChild(cell);
                    }
            
                    gridContainer.appendChild(fragment);

                                        // Populate Row Numbers dynamically based on grid size
                                                                                const numRows = 60;
                                        const rowFragment = document.createDocumentFragment();
                                        for (let r = 1; r <= numRows; r++) {
                                            const rn = document.createElement('div');
                                            rn.className = 'row-number';
                                            rn.textContent = r;
                                            rowFragment.appendChild(rn);
                                        }
                                        rowNumbersEl.appendChild(rowFragment);

                                        // Handle the Flash Text Overlay
                                                                                if (isSubGrid) {
                                                                                    flashTextEl.textContent = 'BOX ' + activeMainBox;
                                                                                    startSimulation();
                                                                                } else {
                                                                                    flashTextEl.textContent = 'MAIN GRID';
                                                                                }
            
                    flashTextEl.style.animation = 'none';
                    void flashTextEl.offsetWidth; // Trigger reflow to restart animation
                    flashTextEl.style.animation = 'flashTextAnim 1s ease-out forwards';
                }

                function startSimulation() {
                                let currentTick = 0;
                                const cells = gridContainer.querySelectorAll('.grid-cell');
                
                                // Track the color, streak, and start column independently for each of the 60 rows
                                                                const rowStates = Array.from({ length: 60 }, () => ({ color: null, streak: 0, startCol: 1 }));
                
                                                                simInterval = setInterval(() => {
                                                                                                    if (currentTick >= 300) {
                                                                                                        clearInterval(simInterval);
                                                                                                        simInterval = null;
                                                                                                        return;
                                                                                                    }
                    
                                                                    // Random tick: green (up) or red (down)
                                                                    const isGreen = Math.random() > 0.5;
                                                                    const tickColor = isGreen ? '#00ff00' : '#ff0000';
                    
                                                                    // Calculate which row (0-59) and col (1-5) this tick falls into
                                                                    const row = currentTick % 60;
                                                                    const col = Math.floor(currentTick / 60) + 1;
                    
                                    // Check the streak horizontally (compare with the last state of this specific row)
                                                                        if (rowStates[row].color === tickColor) {
                                                                            rowStates[row].streak++;
                                                                        } else {
                                                                            rowStates[row].streak = 1;
                                                                            rowStates[row].color = tickColor;
                                                                            rowStates[row].startCol = col;
                                                                        }
                    
                                    const cell = cells[currentTick];
                                    cell.textContent = 'x' + rowStates[row].streak;
                                    cell.style.color = tickColor;
                                    cell.style.fontWeight = 'bold';
                    
                                    currentTick++;
                                                                    }, 1000); // 1 tick per second
                                                                }

                                                gridContainer.addEventListener('click', function(e) {
                if (e.target.classList.contains('grid-cell')) {
                    if (!isCurrentGrid300) {
                        // Clicked a main grid box -> go to its 300 grid
                        activeMainBox = parseInt(e.target.dataset.boxNum);
                        renderGrid(300, true);
                    } else {
                        // Clicked inside a 300 grid -> go back to main grid
                        renderGrid(totalCells, false);
                    }
                }
            });

            renderGrid(totalCells, false);

                                    function updateClocks() {
                                        const now = new Date();
                                        // IST is UTC+5:30 (Jamshedpur local time)
                                        const ist = now.toLocaleTimeString('en-US', { timeZone: 'Asia/Kolkata', hour12: false, hour: '2-digit', minute:'2-digit', second:'2-digit' });
                                        // EST/EDT for New York session tracking
                                        const est = now.toLocaleTimeString('en-US', { timeZone: 'America/New_York', hour12: false, hour: '2-digit', minute:'2-digit', second:'2-digit' });
                            
                                        const timeDisplay = document.getElementById('time-display');
                                        if (timeDisplay) {
                                            timeDisplay.textContent = `IST: ${ist} | NY: ${est}`;
                                        }
                                    }
                        
                                    setInterval(updateClocks, 1000);
                                    updateClocks();
                    </script>

</body>
</html>
