<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>24x60 Edge-to-Edge Grid</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000000;
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* Left section strictly 75%, completely flush */
        .left-panel {
            width: 75%;
            height: 100%;
            /* Padding removed for edge-to-edge fit */
        }

        /* Right section 25%, completely empty */
        .right-panel {
            width: 25%;
            height: 100%;
        }

        /* Grid fills the left panel entirely */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(24, 1fr);
            grid-template-rows: repeat(60, 1fr);
            width: 100%;
            height: 100%;
            /* Gap removed to keep edges completely tight */
        }

        /* Grid cells compress/stretch into rectangles automatically */
        .grid-cell {
            box-sizing: border-box;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background-color: rgba(255, 255, 255, 0.02);
        }

        .grid-cell:hover {
            background-color: rgba(255, 255, 255, 0.15);
            transition: background-color 0.1s;
        }
    </style>
</head>
<body>

    <div class="left-panel">
        <div class="grid-container" id="matrix-grid"></div>
    </div>

    <div class="right-panel"></div>

    <script>
        const gridContainer = document.getElementById('matrix-grid');
        const totalCells = 24 * 60; 
        const fragment = document.createDocumentFragment();

        for (let i = 0; i < totalCells; i++) {
            const cell = document.createElement('div');
            cell.className = 'grid-cell';
            fragment.appendChild(cell);
        }

        gridContainer.appendChild(fragment);
    </script>

</body>
</html>
