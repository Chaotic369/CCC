<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>24x60 Edge-to-Edge Grid</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000000;
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* Left section strictly 75%, completely flush */
                        .left-panel {
                            width: 75%;
                            height: 100%;
                            position: relative; /* Added for the flash text overlay */
                            display: flex; /* Flex layout to keep row numbers and grid side-by-side */
                        }

                        #row-numbers {
                                            width: 40px;
                                            height: 100%;
                                            border-left: 3px solid grey; /* Bold separation line */
                                            display: flex;
                                            flex-direction: column;
                                            box-sizing: border-box;
                                            background-color: #000000;
                                            z-index: 5;
                                        }

                        .row-number {
                                            flex: 1;
                                            display: flex;
                                            align-items: center;
                                            justify-content: center;
                                            color: grey;
                                            font-size: min(1vw, 1.2vh);
                                            font-family: sans-serif;
                                            box-sizing: border-box;
                                            border-bottom: 1px solid grey;
                                            border-right: 1px solid grey;
                                            background-color: #000000;
                                        }
                
                                        .row-number:first-child {
                                            border-top: 1px solid grey;
                                        }

                /* The new text flash overlay */
                #flash-text {
                    position: absolute;
                    top: 50%;
                    left: 50%;
                    transform: translate(-50%, -50%);
                    color: white;
                    font-family: sans-serif;
                    font-size: 8vw;
                    font-weight: bold;
                    pointer-events: none; /* So it doesn't block your clicks */
                    opacity: 0;
                    text-shadow: 0 0 20px rgba(255,255,255,0.5);
                    z-index: 10;
                }

                @keyframes flashTextAnim {
                    0% { opacity: 1; transform: translate(-50%, -50%) scale(0.8); }
                    20% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
                    100% { opacity: 0; transform: translate(-50%, -50%) scale(1.5); }
                }

                /* Right section 25% */
                                .right-panel {
                                    width: 25%;
                                    height: 100%;
                                    display: flex;
                                    flex-direction: column;
                                    align-items: center;
                                    padding-top: 10px;
                                    box-sizing: border-box;
                                    font-family: sans-serif;
                                }

                                #toggle-btn {
                                                                    background-color: transparent;
                                                                    color: grey;
                                                                    border: 1px solid grey;
                                                                    padding: 5px 10px; /* Made smaller */
                                                                    cursor: pointer;
                                                                    font-size: 12px; /* Made smaller */
                                                                    height: fit-content;
                                                                    margin-bottom: 10px;
                                                                }
        
                                                                #toggle-btn:hover {
                                                                    background-color: grey;
                                                                    color: black;
                                                                }

                                /* Analysis Log Container */
                                                #analysis-panel {
                                                    width: 100%;
                                                    flex-grow: 1;
                                                    padding: 10px;
                                                    box-sizing: border-box;
                                                    overflow-y: auto;
                                                    font-size: 12px;
                                                }

                                                .analysis-table {
                                                    width: 100%;
                                                    border-collapse: collapse;
                                                    color: grey;
                                                    font-family: sans-serif;
                                                }

                                                .analysis-table th, .analysis-table td {
                                                    border: 1px solid grey;
                                                    padding: 4px 6px;
                                                    text-align: center;
                                                }

                                                .analysis-table th {
                                                    background-color: #111111;
                                                    color: #ffffff;
                                                }

                /* Grid fills the left panel entirely */
                        .grid-container {
                            display: grid;
                            grid-template-columns: repeat(24, 1fr);
                            grid-template-rows: repeat(60, 1fr);
                            flex: 1; /* Takes the remaining space dynamically next to row-numbers */
                            height: 100%;
                            /* Gap removed to keep edges completely tight */
                        }

        /* Grid cells compress/stretch into rectangles automatically */
                .grid-cell {
                    box-sizing: border-box;
                    border: 1px solid grey;
                    background-color: #000000;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    color: grey;
                    font-size: min(1vw, 1.2vh); /* dynamically fits */
                    overflow: hidden;
                    user-select: none;
                }

                .grid-cell:hover {
                            background-color: #ffffff;
                            color: #000000;
                            transition: all 0.1s;
                        }

                        /* 300 boxes grid: 15 cols x 20 rows = 300 */
                                        .grid-container.grid-300 {
                                                            grid-template-columns: repeat(15, 1fr);
                                                            grid-template-rows: repeat(20, 1fr);
                                                            grid-auto-flow: column; /* Restored to fill vertically (top-to-bottom first) */
                                                        }
                                                    </style>
</head>
<body>

    <div class="left-panel">
                <div id="flash-text"></div>
                <div class="grid-container" id="matrix-grid"></div>
                <div id="row-numbers"></div>
            </div>

    <div class="right-panel">
                    <button id="toggle-btn">Toggle Grid</button>
                    <div id="analysis-panel"></div>
                </div>

    <script>
                    const gridContainer = document.getElementById('matrix-grid');
                    const rowNumbersEl = document.getElementById('row-numbers');
                    const toggleBtn = document.getElementById('toggle-btn');
                    const flashTextEl = document.getElementById('flash-text');
                    const analysisPanel = document.getElementById('analysis-panel');
                    const totalCells = 24 * 60; 
                    let isCurrentGrid300 = false;
                    let activeMainBox = 1;
                    let simInterval = null;
                    let tableBodyEl = null;

                    function renderGrid(count, isSubGrid) {
                                    if (simInterval) {
                                        clearInterval(simInterval);
                                        simInterval = null;
                                    }
                                    isCurrentGrid300 = isSubGrid;
                                    gridContainer.innerHTML = '';
                                    analysisPanel.innerHTML = ''; // Clear logs when swapping grids
                                    rowNumbersEl.innerHTML = ''; // Clear row numbers

                                    if (isSubGrid) {
                                        const table = document.createElement('table');
                                        table.className = 'analysis-table';
                                        table.innerHTML = '<thead><tr><th>Row</th><th>Range</th><th>Color</th></tr></thead><tbody></tbody>';
                                        analysisPanel.appendChild(table);
                                        tableBodyEl = table.querySelector('tbody');
                                    }
            
                                    if (isSubGrid) {
                        gridContainer.classList.add('grid-300');
                    } else {
                        gridContainer.classList.remove('grid-300');
                    }
            
                    const fragment = document.createDocumentFragment();
                    for (let i = 0; i < count; i++) {
                        const cell = document.createElement('div');
                        cell.className = 'grid-cell'; 
                        if (!isSubGrid) {
                            cell.textContent = i + 1; 
                            // Remember the box number so clicking it opens its specific grid
                            cell.dataset.boxNum = i + 1;
                        } else {
                            // Keep cells blank initially for the simulation
                            cell.textContent = ''; 
                        }
                        fragment.appendChild(cell);
                    }
            
                    gridContainer.appendChild(fragment);

                                        // Populate Row Numbers dynamically based on grid size
                                        const numRows = isSubGrid ? 20 : 60;
                                        const rowFragment = document.createDocumentFragment();
                                        for (let r = 1; r <= numRows; r++) {
                                            const rn = document.createElement('div');
                                            rn.className = 'row-number';
                                            rn.textContent = r;
                                            rowFragment.appendChild(rn);
                                        }
                                        rowNumbersEl.appendChild(rowFragment);

                                        // Handle the Flash Text Overlay
                                        if (isSubGrid) {
                                            flashTextEl.textContent = 'BOX ' + activeMainBox;
                                            toggleBtn.textContent = 'Next Box Grid';
                                            startSimulation();
                                        } else {
                                            flashTextEl.textContent = 'MAIN GRID';
                                            toggleBtn.textContent = 'Open Box Grid';
                                        }
            
                    flashTextEl.style.animation = 'none';
                    void flashTextEl.offsetWidth; // Trigger reflow to restart animation
                    flashTextEl.style.animation = 'flashTextAnim 1s ease-out forwards';
                }

                function startSimulation() {
                                let currentTick = 0;
                                const cells = gridContainer.querySelectorAll('.grid-cell');
                
                                // Track the color, streak, and start column independently for each of the 20 rows
                                const rowStates = Array.from({ length: 20 }, () => ({ color: null, streak: 0, startCol: 1 }));
                
                                simInterval = setInterval(() => {
                                                                    if (currentTick >= 300) {
                                                                        clearInterval(simInterval);
                                                                        simInterval = null;
                                                                        return;
                                                                    }
                    
                                    // Random tick: green (up) or red (down)
                                    const isGreen = Math.random() > 0.5;
                                    const tickColor = isGreen ? '#00ff00' : '#ff0000';
                    
                                    // Calculate which row (0-19) and col (1-15) this tick falls into
                                    const row = currentTick % 20;
                                    const col = Math.floor(currentTick / 20) + 1;
                    
                                    // Check the streak horizontally (compare with the last state of this specific row)
                                    if (rowStates[row].color === tickColor) {
                                        rowStates[row].streak++;
                                    } else {
                                        // If it's a break (and not the very first tick of the row)
                                                                                if (rowStates[row].color !== null && tableBodyEl) {
                                                                                    const endCol = col - 1;
                                                                                    const tr = document.createElement('tr');
                                                                                    const isGreen = tickColor === '#00ff00';
                                            
                                                                                    tr.innerHTML = `<td>Row ${row + 1}</td><td>B${rowStates[row].startCol}-B${endCol}</td><td style="color: ${tickColor}; font-weight: bold;">${isGreen ? 'GREEN' : 'RED'}</td>`;
                                            
                                                                                    tableBodyEl.appendChild(tr);
                                                                                    analysisPanel.scrollTop = analysisPanel.scrollHeight; // Auto-scroll to bottom
                                                                                }
                        
                                        rowStates[row].streak = 1;
                                        rowStates[row].color = tickColor;
                                        rowStates[row].startCol = col;
                                    }
                    
                                    const cell = cells[currentTick];
                                    cell.textContent = 'x' + rowStates[row].streak;
                                    cell.style.color = tickColor;
                                    cell.style.fontWeight = 'bold';
                    
                                    currentTick++;
                                                                    }, 1000); // 1 tick per second
                                                                }

                                                gridContainer.addEventListener('click', function(e) {
                if (e.target.classList.contains('grid-cell')) {
                    if (!isCurrentGrid300) {
                        // Clicked a main grid box -> go to its 300 grid
                        activeMainBox = parseInt(e.target.dataset.boxNum);
                        renderGrid(300, true);
                    } else {
                        // Clicked inside a 300 grid -> go back to main grid
                        renderGrid(totalCells, false);
                    }
                }
            });

            toggleBtn.addEventListener('click', function() {
                            if (isCurrentGrid300) {
                                // If already in a sub-grid, cycle to the next box's grid
                                activeMainBox++;
                                if (activeMainBox > totalCells) activeMainBox = 1;
                                renderGrid(300, true);
                            } else {
                                // Open the grid for whatever box was active last (default 1)
                                renderGrid(300, true);
                            }
                        });

                        renderGrid(totalCells, false);
        </script>

</body>
</html>
